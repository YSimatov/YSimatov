<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07040D"/>
      <stop offset="0.58" stop-color="#0C0615"/>
      <stop offset="1" stop-color="#080510"/>
    </linearGradient>

    <linearGradient id="purpleLine" x1="54" y1="0" x2="740" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D28D9" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#8B5CF6"/>
      <stop offset="0.7" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5EEFF"/>
      <stop offset="0.62" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 150) rotate(90) scale(240 390)">
      <stop stop-color="#7C3AED" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1038 92) rotate(90) scale(180 280)">
      <stop stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tinyGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#FFFFFF" stroke-opacity="0.018"/>
    </pattern>

    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#A855F7" stroke-opacity="0.05"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0; 1.8 0.8; 0 0" dur="12s" repeatCount="indefinite"/>
    </pattern>

    <clipPath id="rounded">
      <rect x="1" y="1" width="1198" height="318" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>
    <rect width="1200" height="320" fill="url(#microgrid)"/>
    <rect width="1200" height="320" fill="url(#scan)"/>

    <!-- drifting background lines -->
    <g opacity="0.24">
      <g><path d="M650 -40L500 360" stroke="#7C3AED" stroke-opacity="0.22"/><animateTransform attributeName="transform" type="translate" values="-70 0; 90 0; -70 0" dur="18s" repeatCount="indefinite"/></g>
      <g><path d="M760 -30L610 360" stroke="#A855F7" stroke-opacity="0.20"/><animateTransform attributeName="transform" type="translate" values="80 0; -100 0; 80 0" dur="19s" repeatCount="indefinite"/></g>
      <g><path d="M845 -30L700 360" stroke="#22D3EE" stroke-opacity="0.13"/><animateTransform attributeName="transform" type="translate" values="-40 0; 110 0; -40 0" dur="17s" repeatCount="indefinite"/></g>
      <g><path d="M940 -50L775 360" stroke="#7C3AED" stroke-opacity="0.17"/><animateTransform attributeName="transform" type="translate" values="100 0; -70 0; 100 0" dur="21s" repeatCount="indefinite"/></g>
      <g><path d="M1040 -30L890 360" stroke="#A855F7" stroke-opacity="0.15"/><animateTransform attributeName="transform" type="translate" values="-60 0; 85 0; -60 0" dur="20s" repeatCount="indefinite"/></g>
    </g>

    <g opacity="0.12">
      <g><path d="M-100 86H1320" stroke="#A855F7" stroke-opacity="0.08"/><animateTransform attributeName="transform" type="translate" values="-40 0; 65 0; -40 0" dur="16s" repeatCount="indefinite"/></g>
      <g><path d="M-120 118H1310" stroke="#22D3EE" stroke-opacity="0.07"/><animateTransform attributeName="transform" type="translate" values="55 0; -55 0; 55 0" dur="13s" repeatCount="indefinite"/></g>
      <g><path d="M-80 242H1300" stroke="#7C3AED" stroke-opacity="0.08"/><animateTransform attributeName="transform" type="translate" values="-65 0; 50 0; -65 0" dur="15s" repeatCount="indefinite"/></g>
    </g>

    <!-- perspective floor -->
    <g opacity="0.22">
      <path d="M664 320L920 196L1188 320" stroke="#7C3AED"><animate attributeName="opacity" values="0.18;0.25;0.18" dur="6s" repeatCount="indefinite"/></path>
      <path d="M708 320L936 208L1151 320" stroke="#7C3AED" stroke-opacity="0.75"/>
      <path d="M754 320L950 220L1113 320" stroke="#7C3AED" stroke-opacity="0.55"/>
      <path d="M800 320L965 233L1075 320" stroke="#7C3AED" stroke-opacity="0.35"/>
      <path d="M846 320L978 245L1038 320" stroke="#7C3AED" stroke-opacity="0.20"/>
      <path d="M664 320H1188" stroke="#A855F7" stroke-opacity="0.15"/>
      <path d="M724 292H1130" stroke="#A855F7" stroke-opacity="0.13"/>
      <path d="M780 267H1080" stroke="#A855F7" stroke-opacity="0.11"/>
      <path d="M829 245H1038" stroke="#A855F7" stroke-opacity="0.09"/>
      <path d="M871 226H1004" stroke="#A855F7" stroke-opacity="0.07"/>
    </g>

    <text x="54" y="42" fill="#8B8198" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">TELEGRAM // @ysimatov</text>
    <text x="1146" y="42" text-anchor="end" fill="#8B8198" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">STATUS / BUILDING</text>

    <text x="54" y="132" fill="url(#nameGrad)" font-size="72" font-weight="800" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">YSIMATOV</text>

    <rect x="505" y="82" width="7" height="54" rx="2" fill="#A855F7" filter="url(#tinyGlow)">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.85s" repeatCount="indefinite"/>
    </rect>

    <rect x="54" y="154" width="648" height="2" rx="1" fill="url(#purpleLine)" filter="url(#softGlow)">
      <animate attributeName="width" values="640;648;644;648" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="54" y="189" fill="#D7CCDF" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.4">SOFTWARE DEVELOPER / BACKEND / FULL-STACK / AI</text>
    <text x="54" y="229" fill="#9D93A8" font-size="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">building with Python · Go · Angular · agentic workflows</text>
    <text x="54" y="255" fill="#9D93A8" font-size="14.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AI APIs · local models · automation · full-stack systems</text>

    <!-- HUD -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="842" y="80" width="304" height="134" rx="14" fill="#0D0718" fill-opacity="0.88" stroke="#7C3AED" stroke-opacity="0.42"/>
      <path d="M842 112H1146" stroke="#7C3AED" stroke-opacity="0.22"/>
      <circle cx="866" cy="96" r="4" fill="#A855F7" filter="url(#tinyGlow)"><animate attributeName="opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="882" y="101" fill="#BFB3C9" font-size="12" letter-spacing="1.3">ACTIVE PROFILE</text>

      <text x="866" y="137" fill="#6F647A" font-size="11" letter-spacing="1">PRIMARY</text>
      <g transform="translate(1119 137)">
        <!-- Base texts: equal timing, always visible, no permanent glitch -->
        <text x="0" y="0" text-anchor="end" fill="#E7DDF0" font-size="13">
          PYTHON
          <animate attributeName="opacity" values="1;1;0;0;0;0;1;1" keyTimes="0;0.298;0.321;0.631;0.654;0.964;0.987;1" dur="8.4s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#E7DDF0" font-size="13">
          GO
          <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.298;0.321;0.631;0.654;0.964;0.987;1" dur="8.4s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#E7DDF0" font-size="13">
          C#
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.298;0.321;0.631;0.654;0.964;0.987;1" dur="8.4s" repeatCount="indefinite"/>
        </text>

        <!-- brief glitch flashes only during switches -->
        <text x="0" y="0" text-anchor="end" fill="#FF48D3" font-size="13" opacity="0">
          GO
          <animate attributeName="opacity" values="0;0.55;0;0.25;0" dur="0.20s" begin="2.50s;10.90s;19.30s" fill="freeze"/>
          <animate attributeName="x" values="0;2;-1;0;0" dur="0.20s" begin="2.50s;10.90s;19.30s" fill="freeze"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#22D3EE" font-size="13" opacity="0">
          GO
          <animate attributeName="opacity" values="0;0.45;0;0.2;0" dur="0.20s" begin="2.50s;10.90s;19.30s" fill="freeze"/>
          <animate attributeName="x" values="0;-2;1;0;0" dur="0.20s" begin="2.50s;10.90s;19.30s" fill="freeze"/>
        </text>

        <text x="0" y="0" text-anchor="end" fill="#FF48D3" font-size="13" opacity="0">
          C#
          <animate attributeName="opacity" values="0;0.55;0;0.25;0" dur="0.20s" begin="5.15s;13.55s;21.95s" fill="freeze"/>
          <animate attributeName="x" values="0;2;-1;0;0" dur="0.20s" begin="5.15s;13.55s;21.95s" fill="freeze"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#22D3EE" font-size="13" opacity="0">
          C#
          <animate attributeName="opacity" values="0;0.45;0;0.2;0" dur="0.20s" begin="5.15s;13.55s;21.95s" fill="freeze"/>
          <animate attributeName="x" values="0;-2;1;0;0" dur="0.20s" begin="5.15s;13.55s;21.95s" fill="freeze"/>
        </text>

        <text x="0" y="0" text-anchor="end" fill="#FF48D3" font-size="13" opacity="0">
          PYTHON
          <animate attributeName="opacity" values="0;0.55;0;0.25;0" dur="0.20s" begin="7.80s;16.20s;24.60s" fill="freeze"/>
          <animate attributeName="x" values="0;2;-1;0;0" dur="0.20s" begin="7.80s;16.20s;24.60s" fill="freeze"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#22D3EE" font-size="13" opacity="0">
          PYTHON
          <animate attributeName="opacity" values="0;0.45;0;0.2;0" dur="0.20s" begin="7.80s;16.20s;24.60s" fill="freeze"/>
          <animate attributeName="x" values="0;-2;1;0;0" dur="0.20s" begin="7.80s;16.20s;24.60s" fill="freeze"/>
        </text>
      </g>

      <text x="866" y="163" fill="#6F647A" font-size="11" letter-spacing="1">WEB</text>
      <g transform="translate(1119 163)">
        <text x="0" y="0" text-anchor="end" fill="#E7DDF0" font-size="13">
          GO + ANGULAR
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.469;0.5;0.969;1" dur="6.4s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#E7DDF0" font-size="13">
          C# + REACT
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.469;0.5;0.969;1" dur="6.4s" repeatCount="indefinite"/>
        </text>

        <text x="0" y="0" text-anchor="end" fill="#FF48D3" font-size="13" opacity="0">
          C# + REACT
          <animate attributeName="opacity" values="0;0.5;0;0.22;0" dur="0.20s" begin="3.00s;9.40s;15.80s" fill="freeze"/>
          <animate attributeName="x" values="0;2;-1;0;0" dur="0.20s" begin="3.00s;9.40s;15.80s" fill="freeze"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#22D3EE" font-size="13" opacity="0">
          C# + REACT
          <animate attributeName="opacity" values="0;0.42;0;0.18;0" dur="0.20s" begin="3.00s;9.40s;15.80s" fill="freeze"/>
          <animate attributeName="x" values="0;-2;1;0;0" dur="0.20s" begin="3.00s;9.40s;15.80s" fill="freeze"/>
        </text>

        <text x="0" y="0" text-anchor="end" fill="#FF48D3" font-size="13" opacity="0">
          GO + ANGULAR
          <animate attributeName="opacity" values="0;0.5;0;0.22;0" dur="0.20s" begin="6.20s;12.60s;19.00s" fill="freeze"/>
          <animate attributeName="x" values="0;2;-1;0;0" dur="0.20s" begin="6.20s;12.60s;19.00s" fill="freeze"/>
        </text>
        <text x="0" y="0" text-anchor="end" fill="#22D3EE" font-size="13" opacity="0">
          GO + ANGULAR
          <animate attributeName="opacity" values="0;0.42;0;0.18;0" dur="0.20s" begin="6.20s;12.60s;19.00s" fill="freeze"/>
          <animate attributeName="x" values="0;-2;1;0;0" dur="0.20s" begin="6.20s;12.60s;19.00s" fill="freeze"/>
        </text>
      </g>

      <text x="866" y="189" fill="#6F647A" font-size="11" letter-spacing="1">FOCUS</text>
      <text x="1119" y="189" text-anchor="end" fill="#C084FC" font-size="13">AGENTIC AI
        <animate attributeName="opacity" values="1;0.55;1;0.75;1" dur="2.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <g>
      <path d="M54 286H254" stroke="#22D3EE" stroke-opacity="0.35"/>
      <circle cy="286" r="3.2" fill="#22D3EE" filter="url(#cyanGlow)">
        <animate attributeName="cx" values="54;254;54" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <path d="M942 286H1142" stroke="#22D3EE" stroke-opacity="0.35"/>
      <circle cy="286" r="3.2" fill="#22D3EE" filter="url(#cyanGlow)">
        <animate attributeName="cx" values="942;1142;942" dur="4.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.35">
      <circle cx="782" cy="210" r="1.5" fill="#A855F7">
        <animate attributeName="cx" values="782;798;782" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="210;202;210" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="732" cy="120" r="1.2" fill="#22D3EE">
        <animate attributeName="cx" values="732;748;732" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;114;120" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.06;0.32;0.06" dur="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="22" stroke="#7C3AED" stroke-opacity="0.28"/>
</svg>
